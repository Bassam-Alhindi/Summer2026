  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowEmerald)"/>
  <rect x="24" y="24" width="1152" height="582" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- wallet mark (same paths as favicon.svg), centred at 600,196 -->
