<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07070b"/>
      <stop offset="0.55" stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1"
      gradientTransform="translate(210 150) scale(520)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="0" cy="0" r="1"
